<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPAP Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>CPAP Store</h1>
      <p class="tagline">Top-rated CPAP equipment — find the best price on Amazon</p>
    </div>
  </header>

  <main>
    <div class="product-grid" id="product-grid"></div>
  </main>

  <footer>
    <p>© <span id="year"></span> CPAP Store · Product links are affiliate links</p>
  </footer>

  <script src="products.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const grid = document.getElementById("product-grid");

    products.forEach(product => {
      const card = document.createElement("div");
      card.className = "product-card";

      card.innerHTML = `
        <div class="product-image-wrap">
          ${product.badge ? `<span class="badge">${product.badge}</span>` : ""}
          <img
            src="${product.image}"
            alt="${product.name}"
            onerror="this.src='images/placeholder.svg'"
          />
        </div>
        <div class="product-info">
          <h2 class="product-name">${product.name}</h2>
          <p class="product-description">${product.description}</p>
          <a class="amazon-btn" href="${product.amazonUrl}" target="_blank" rel="noopener noreferrer">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
              <path d="M13 3L4 14h7l-1 7 9-11h-7z"/>
            </svg>
            Check Price on Amazon
          </a>
        </div>
      `;

      grid.appendChild(card);
    });
  </script>

</body>
</html>
